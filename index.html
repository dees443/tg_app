const steps=['Послуга','Майстер','Дизайн','Дата','Час','Підтвердження'];
const times=['09:00','10:30','12:00','13:30','15:00','17:00','18:30'];
function stored(key){try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch{return []}}
const state={page:'home',favorites:stored('luna-favorites'),appointments:stored('luna-appointments'),category:'Усі',favoritesOnly:false,step:0,serviceId:2,masterId:0,designId:null,date:upcomingDays()[0],time:'',comment:'',tab:'upcoming',submitting:false,success:null,rescheduleId:null,admin:false};
let tg=window.Telegram?.WebApp;
let user=tg?.initData ? tg.initDataUnsafe.user : null;
let toastTimer,previousFocus,telegramNextHandler,telegramBackHandler;
function persist(){try{localStorage.setItem('luna-favorites',JSON.stringify(state.favorites));localStorage.setItem('luna-appointments',JSON.stringify(state.appointments))}catch{notify('Браузер не дозволяє зберегти дані. Вони доступні до закриття сторінки.')}}
function notify(text){document.getElementById('toast-root').innerHTML=`<div class="toast" role="status">${icon('Check',17)}${escapeHtml(text)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast-root').replaceChildren(),3000)}
function navigate(page){state.page=page;state.success=null;state.admin=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function startBooking(designId=null,masterId=0,serviceId=2){Object.assign(state,{designId,masterId,serviceId,step:0,time:'',comment:'',rescheduleId:null});navigate('booking')}
function getService(){return services.find(s=>s.id===state.serviceId)}
function getDesign(){return designs.find(d=>d.id===state.designId)}
function getMaster(){return masters.find(m=>m.id===state.masterId)}
function total(){return getService().price+(getDesign()?.price||0)}
function available(slot,candidate=state.masterId){const start=toMinutes(slot);if(start+getService().duration>1200)return false;const free=id=>!state.appointments.some(a=>{const t=toMinutes(a.time);return a.id!==state.rescheduleId&&a.status==='confirmed'&&a.date===state.date&&a.masterId===id&&start<t+services.find(s=>s.id===a.serviceId).duration&&start+getService().duration>t});return candidate?free(candidate):masters.some(m=>free(m.id))}
function toMinutes(time){return Number(time.split(':')[0])*60+Number(time.split(':')[1])}
function designCard(d){const saved=state.favorites.includes(d.id);return `<article class="design-card"><div class="design-image"><button class="image-button" data-action="preview" data-id="${d.id}" aria-label="Переглянути ${d.name}"><img src="${d.image}" alt="Манікюр ${d.name}" loading="lazy" style="object-position:${d.position};filter:${d.tint}"></button><span class="image-tag">${d.category}</span><button class="heart ${saved?'saved':''}" data-action="favorite" data-id="${d.id}" aria-label="${saved?'Видалити з обраного':'Додати в обране'}">${icon('Heart',18,saved)}</button></div><div class="design-details"><div><h3>${d.name}</h3><span>Дизайн від ${money(d.price)}</span></div><button class="circle-button" data-action="book" data-design="${d.id}" aria-label="Записатися з дизайном ${d.name}">${icon('ArrowUpRight',19)}</button></div></article>`}
function sectionHeading(eyebrow,title,action=''){return `<div class="section-heading"><div><span class="eyebrow">${eyebrow}</span><h2>${title}</h2></div>${action}</div>`}
function footer(){return `<footer><span class="footer-brand">luna nails.</span><span>З любов’ю до тебе та кожної деталі.</span><span>© ${new Date().getFullYear()} Luna Nails · Демо</span></footer>`}
function home(){const days=upcomingDays();return `<div class="welcome"><span><span class="online-dot"></span>ТВОЯ ПАУЗА ДЛЯ СЕБЕ</span><span class="welcome-location">${icon('MapPin',13)} Київ, Україна</span></div>
<section class="hero"><div class="hero-copy"><div class="pill">${icon('Sparkles',13)} BEAUTY IS IN THE DETAILS</div><h1>Твій маленький<br>ритуал <em>краси.</em></h1><p>Манікюр, який підкреслює твій стиль.<br>Трохи турботи, трохи магії — і багато тебе.</p><div class="hero-buttons"><button class="button" data-action="book">Обрати свій час ${icon('ArrowUpRight')}</button><button class="text-button" data-action="page" data-page="designs">Знайти натхнення ${icon('ArrowRight',17)}</button></div><div class="social-proof"><div class="avatar-stack">${masters.map(m=>`<img src="${m.image}" alt="">`).join('')}</div><div><span class="stars">★★★★★</span><p><b>4.9</b> · понад 300 щасливих клієнток</p></div></div></div><div class="hero-photo"><img src="${nailPhoto}" alt="Ніжний нюдовий манікюр"><div class="photo-label">${icon('Sparkles',17)}<span>Деталі, в які закохуєшся</span></div><span class="hero-photo-caption">THE LUNA TOUCH</span></div><span class="hero-flower">✳</span></section>
<div class="benefits"><span>${icon('ShieldCheck')} Стерильність без компромісів</span><span>${icon('Heart')} Турбота в кожному дотику</span><span>${icon('Star')} Майстри, яким довіряють</span></div>
<section class="section">${sectionHeading('ЗНАЙДИ СВІЙ НАСТРІЙ','На кінчиках <em>пальців</em>',`<button class="text-button" data-action="page" data-page="designs">Усі дизайни ${icon('ArrowUpRight',17)}</button>`)}<div class="home-designs">${designs.slice(0,4).map(designCard).join('')}</div></section>
<section class="availability-banner"><div class="availability-title"><span class="round-icon">${icon('CalendarDays',22)}</span><div><h3>Час для себе вже є</h3><p>Найближчі години · деморозклад</p></div></div><div class="quick-slots">${[[days[0],'17:00','Сьогодні'],[days[1],'10:30','Завтра'],[days[1],'12:00','Завтра']].map(([d,t,l])=>`<button data-action="quick" data-date="${d}" data-time="${t}"><span>${l}</span><b>${t}</b>${icon('ArrowUpRight',17)}</button>`).join('')}</div></section>
<section class="section">${sectionHeading('ТВОЇ РУКИ В ХОРОШИХ РУКАХ','Знайомся, <em>наші майстри</em>','<span class="subtle">Талант. Досвід. Трохи магії.</span>')}<div class="masters-grid">${masters.map(m=>`<button class="master-card" data-action="master-preview" data-id="${m.id}"><img src="${m.image}" alt="${m.name}"><div><h3>${m.name}<span>${icon('Star',12,true)} ${m.rating}</span></h3><p>${m.specialty}</p><small>${m.experience} ${m.experience===3?'роки':'років'} досвіду</small></div>${icon('ArrowUpRight',19)}</button>`).join('')}</div></section>
<section class="section">${sectionHeading('ВІД ОСНОВИ ДО ОСТАННЬОЇ ДЕТАЛІ','Турбота, яку <em>ти обираєш</em>')}<div class="home-services">${services.slice(0,3).map((s,i)=>`<button class="service-card" data-action="book" data-service="${s.id}"><span class="service-number">0${i+1}</span><h3>${s.name}</h3><p>${s.description}</p><div><span>${icon('Clock3',14)} ${s.duration} хв</span><strong>${money(s.price)} ${icon('ArrowUpRight',16)}</strong></div></button>`).join('')}</div></section><div class="studio-note"><span>luna love note</span><p>Краса починається з моменту,<br>який ти присвячуєш <em>собі.</em></p>${icon('Heart',22)}</div>`}
function catalog(){const filtered=designs.filter(d=>(state.category==='Усі'||d.category===state.category)&&(!state.favoritesOnly||state.favorites.includes(d.id)));return `<div class="page-heading"><div><span class="eyebrow">YOUR NEXT NAIL CRUSH</span><h1>${state.favoritesOnly?'Твоє обране':'Знайди свій <em>настрій.</em>'}</h1><p>Збережи те, що відгукується. Ми втілимо твою ідею.</p></div><button class="button secondary" data-action="toggle-favorites">${icon('Heart',17)} Обране · ${state.favorites.length}</button></div><div class="category-strip">${categories.map(c=>`<button class="${state.category===c?'selected':''}" data-action="category" data-category="${c}">${c}</button>`).join('')}${icon('SlidersHorizontal',17)}</div><div class="catalog">${filtered.map(designCard).join('')}</div>${filtered.length?'':`<div class="empty">${icon('Heart',32)}<h3>Тут буде твоє натхнення</h3><p>Додай дизайн в обране, натиснувши на сердечко.</p><button class="button" data-action="all-designs">Переглянути дизайни</button></div>`}`}
function dates(){return `<div class="date-strip">${upcomingDays().map(d=>`<button class="date-cell ${state.date===d?'selected':''}" data-action="date" data-date="${d}"><span>${new Date(d+'T12:00').toLocaleDateString('uk-UA',{weekday:'short'})}</span><strong>${d.slice(-2)}</strong><i></i></button>`).join('')}</div>`}
function bookingStep(){const s=getService();switch(state.step){
case 0:return `<div class="service-options">${services.map(s=>`<button class="option ${state.serviceId===s.id?'selected':''}" data-action="service" data-id="${s.id}"><span class="radio">${state.serviceId===s.id?'<span></span>':''}</span><div><h3>${s.name}</h3><p>${s.description}</p><small>${icon('Clock3',12)} ${s.duration} хв</small></div><strong>${s.id===4||s.id===6?'від ':''}${money(s.price)}</strong></button>`).join('')}</div>`;
case 1:return `<div class="service-options"><button class="option ${!state.masterId?'selected':''}" data-action="master" data-id="0"><span class="round-icon">${icon('Sparkles',20)}</span><div><h3>Будь-який майстер</h3><p>Кожна з нас подбає про тебе</p></div>${!state.masterId?icon('Check'):''}</button>${masters.map(m=>`<button class="option ${state.masterId===m.id?'selected':''}" data-action="master" data-id="${m.id}"><img class="master-avatar" src="${m.image}" alt="${m.name}"><div><h3>${m.name}</h3><p>${m.specialty} · ${m.experience} років досвіду</p></div><span class="rating">${icon('Star',14)} ${m.rating}</span></button>`).join('')}</div>`;
case 2:return `<p class="subtle">Обери натхнення або обговоримо дизайн на місці.</p><button class="option skip-option ${!state.designId?'selected':''}" data-action="design" data-id="0">${icon('Sparkles')} Визначусь із майстром ${!state.designId?icon('Check',16):''}</button><div class="booking-designs">${designs.map(d=>`<button class="design-choice ${state.designId===d.id?'selected':''}" data-action="design" data-id="${d.id}"><img src="${d.image}" alt="${d.name}" style="filter:${d.tint}"><span>${d.name}<small>+ ${money(d.price)}</small></span>${state.designId===d.id?`<i>${icon('Check',15)}</i>`:''}</button>`).join('')}</div>`;
case 3:return `<p class="subtle">${new Date(state.date+'T12:00').toLocaleDateString('uk-UA',{month:'long',year:'numeric'})}</p>${dates()}<div class="soft-note">${icon('CalendarDays',20)}<p>Плануй маленькі радощі заздалегідь.<br><small>Показано демонстраційний графік на 14 днів.</small></p></div>`;
case 4:return `<p class="subtle">${dateLabel(state.date)} · ${getMaster()?.name||'Будь-який майстер'} · ${s.duration} хв</p><div class="time-grid">${times.map(t=>`<button ${available(t)?'':'disabled'} class="${state.time===t?'selected':''}" data-action="time" data-time="${t}">${icon('Clock3',15)}${t}</button>`).join('')}</div><div class="soft-note">${icon('ShieldCheck',20)}<p>Час для твого ритуалу.<br><small>Враховуємо тривалість і локальні демозаписи.</small></p></div>`;
case 5:return `<div class="confirmation-list">${[['Послуга',s.name],['Майстер',getMaster()?.name||'Будь-який майстер'],['Дата',dateLabel(state.date)],['Час',state.time],['Дизайн',getDesign()?.name||'Визначусь на місці'],['Тривалість',`${s.duration} хв`],['Разом',money(total())]].map(([k,v])=>`<div><span>${k}</span><strong>${v}</strong></div>`).join('')}</div><label class="comment-label">Коментар для майстра<textarea id="comment" placeholder="Наприклад, потрібно зняти старе покриття" rows="3" maxlength="500">${escapeHtml(state.comment)}</textarea></label><p class="demo-note">Зберігається лише в цьому браузері. Повідомлення від бота й реальне бронювання ще не підключені.</p>`;
}}
function booking(){if(state.success){const a=state.success;return `<div class="success-screen"><div class="success-icon">${icon('Check',34)}</div><span class="eyebrow">A LITTLE MOMENT FOR YOU</span><h1>Готово <em>💅</em></h1><p>Твій демозапис збережено</p><div class="summary-card"><h2>${dateLabel(a.date)} · ${a.time}</h2><p>${masters.find(m=>m.id===a.masterId).name} · ${services.find(s=>s.id===a.serviceId).name}</p><strong>${money(a.price)}</strong></div><p class="demo-note">Це демонстрація: студія не отримує цей запис.<br>Справжнє підтвердження підключимо з бекендом.</p><button class="button" data-action="page" data-page="appointments">Мої записи ${icon('ArrowRight',17)}</button><button class="text-button" data-action="close-app">Закрити</button></div>`}return `<div class="page-heading"><div><span class="eyebrow">MAKE TIME FOR YOURSELF</span><h1>${state.rescheduleId?'Перенесемо <em>запис.</em>':'Твій наступний <em>манікюр.</em>'}</h1><p>Кілька простих кроків до маленького ритуалу краси.</p></div><span class="demo-badge">Демо · без реального бронювання</span></div><div class="booking-layout"><div class="booking-main"><div class="stepper">${steps.map((s,i)=>`<button ${i>state.step?'disabled':''} class="${i===state.step?'current':i<state.step?'done':''}" data-action="step" data-step="${i}"><span>${i<state.step?icon('Check',13):i+1}</span><small>${s}</small></button>`).join('')}</div><div class="step-content"><span class="eyebrow">КРОК ${state.step+1} З 6</span><h2>${['Обери свою турботу','З ким творимо красу?','Що надихає тебе?','Коли зустрінемось?','Обери зручний час','Усе так, як ти хотіла?'][state.step]}</h2>${bookingStep()}</div><div class="wizard-actions"><button class="text-button" data-action="back">${icon('ArrowLeft',17)} Назад</button><button class="button" data-action="next" ${state.submitting||(state.step===4&&(!state.time||!available(state.time)))?'disabled':''}>${state.submitting?'Зберігаємо…':state.step===5?'Зберегти демозапис':'Продовжити'} ${icon('ArrowRight',17)}</button></div></div><aside class="booking-summary"><span class="eyebrow">ТВІЙ BEAUTY ПЛАН</span><h2>Маленька пауза.<br><em>Велика любов до себе.</em></h2>${getDesign()?`<img src="${getDesign().image}" alt="${getDesign().name}">`:''}<div class="summary-line"><span>Послуга</span><strong>${getService().name}</strong></div><div class="summary-line"><span>Майстер</span><strong>${getMaster()?.name||'Будь-який'}</strong></div><div class="summary-line"><span>Коли</span><strong>${dateLabel(state.date)}${state.time?' · '+state.time:''}</strong></div><div class="summary-total"><span>Разом</span><strong>${money(total())}</strong></div><small>${icon('ShieldCheck',13)} Без передоплати в демоверсії</small></aside></div>`}
function appointmentCard(a,admin=false){const s=services.find(s=>s.id===a.serviceId),m=masters.find(m=>m.id===a.masterId);return `<article class="appointment"><div class="appointment-date">${icon('CalendarDays',22)}<strong>${a.date.slice(-2)}</strong><span>${new Date(a.date+'T12:00').toLocaleDateString('uk-UA',{month:'short'})}</span></div><div class="appointment-info"><span class="status ${a.status}">${a.status==='cancelled'?'Скасовано':a.status==='completed'?'Виконано':'Демозапис'}</span><h3>${s.name}</h3><p>${dateLabel(a.date)} · ${a.time} · ${m.name}</p>${admin?`<p>${escapeHtml(a.comment||'Без коментаря')}</p>`:''}<strong>${money(a.price)}</strong></div>${a.status==='confirmed'&&a.date>=upcomingDays()[0]?`<div class="row-actions">${admin?`<button class="button secondary" data-action="complete" data-id="${a.id}">Завершити</button>`:`<button class="button secondary" data-action="reschedule" data-id="${a.id}">Перенести</button>`}<button class="text-button" data-action="cancel" data-id="${a.id}">Скасувати</button></div>`:''}</article>`}
function appointmentsPage(){const today=upcomingDays()[0];const list=state.appointments.filter(a=>state.tab==='cancelled'?a.status==='cancelled':state.tab==='past'?a.status==='completed'||(a.status==='confirmed'&&a.date<today):a.status==='confirmed'&&a.date>=today);return `<div class="page-heading"><div><span class="eyebrow">ТВОЇ BEAUTY ПЛАНИ</span><h1>Мої <em>записи.</em></h1><p>Усе для твоєї наступної зустрічі з красою.</p></div><button class="button" data-action="book">${icon('Plus',17)} Новий запис</button></div><div class="tabs">${[['upcoming','Майбутні'],['past','Минулі'],['cancelled','Скасовані']].map(([id,l])=>`<button class="${state.tab===id?'selected':''}" data-action="tab" data-tab="${id}">${l}</button>`).join('')}</div>${list.map(a=>appointmentCard(a)).join('')}${!list.length?`<div class="empty">${icon('CalendarDays',36)}<h2>${state.tab==='upcoming'?'Твоя beauty-пауза попереду':'Тут поки тихо'}</h2><p>Твої записи з’являться тут.</p>${state.tab==='upcoming'?`<button class="button" data-action="book">Записатися ${icon('ArrowUpRight',17)}</button>`:''}</div>`:''}<p class="demo-note">Тут відображаються лише демозаписи цього браузера.</p>`}
function profile(){return `<div class="profile-page"><span class="eyebrow">YOUR LUNA SPACE</span><h1>Твій <em>простір.</em></h1><div class="profile-card"><div class="profile-avatar">${user?.photo_url?`<img src="${escapeHtml(user.photo_url)}" alt="Твій аватар">`:icon('UserRound',35)}</div><h2>${user?escapeHtml(user.first_name+' '+(user.last_name||'')):'Привіт, красуне'}</h2><p>${user?.username?'@'+escapeHtml(user.username):user?'Профіль Telegram':'Відкрий у Telegram, щоб побачити свій профіль'}</p><div class="profile-stats"><div><strong>${state.appointments.filter(a=>a.status==='completed').length}</strong><span>відвідувань</span></div><div><strong>${state.favorites.length}</strong><span>улюблених дизайнів</span></div><div><strong>${state.appointments.filter(a=>a.status==='confirmed').length}</strong><span>демозаписів</span></div></div></div><div class="profile-menu">${[['Heart','Моє обране','favorites'],['CalendarDays','Історія записів','history'],['MapPin','Контакти студії','contacts'],['ShieldCheck','Правила запису','rules']].map(([i,l,a])=>`<button data-action="${a}">${icon(i,20)}<span>${l}</span>${icon('ChevronRight')}</button>`).join('')}</div><button class="text-button admin-link" data-action="admin">${icon('SlidersHorizontal',15)} Демо панелі студії</button></div>`}
function adminPage(){const list=state.appointments.filter(a=>a.date===state.date);return `<section class="admin"><div class="page-heading"><div><span class="eyebrow">STUDIO SPACE · ДЕМО</span><h1>Панель студії</h1><p>Локальні записи цього браузера. Авторизацію підключимо з бекендом.</p></div><button class="button secondary" data-action="page" data-page="profile">Вийти</button></div><div class="stats-grid">${[['Записів сьогодні',state.appointments.filter(a=>a.date===upcomingDays()[0]&&a.status==='confirmed').length],['Сума демозаписів',money(state.appointments.filter(a=>a.status!=='cancelled').reduce((n,a)=>n+a.price,0))],['Майстри',3]].map(([l,v])=>`<article class="stat-card"><span>${l}</span><strong>${v}</strong></article>`).join('')}</div><h2>Календар записів</h2>${dates()}${list.map(a=>appointmentCard(a,true)).join('')}${!list.length?`<div class="empty">${icon('CalendarDays')}<h3>На цей день ще немає записів</h3></div>`:''}</section>`}
function render(){const scroll=window.scrollY;document.getElementById('desktop-nav').innerHTML=navItems.filter(n=>n[0]!=='booking').map(([id,l])=>`<button class="${state.page===id?'active':''}" data-action="page" data-page="${id}">${l}</button>`).join('');document.getElementById('bottom-nav').innerHTML=navItems.map(([id,l,i])=>`<button class="${state.page===id?'active':''} ${id==='booking'?'nav-book':''}" data-action="${id==='booking'?'book':'page'}" data-page="${id}"><span>${icon(i,21)}</span><small>${l}</small></button>`).join('');document.getElementById('favorites-button').innerHTML=icon('Heart',20)+(state.favorites.length?'<i></i>':'');document.getElementById('main').innerHTML=(state.admin?adminPage():({home,designs:catalog,booking,appointments:appointmentsPage,profile}[state.page])())+footer();window.scrollTo(0,scroll);updateTelegram()}
function modal(html,className,label){previousFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="modal-overlay" data-action="overlay"><section class="${className}" role="dialog" aria-modal="true" aria-label="${label}"><button class="modal-close" data-action="close-modal" aria-label="Закрити">${icon('X',20)}</button>${html}</section></div>`;document.body.style.overflow='hidden';document.querySelector('[role="dialog"] button')?.focus()}
function closeModal(){document.getElementById('modal-root').replaceChildren();document.body.style.overflow='';previousFocus?.isConnected&&previousFocus.focus()}
function previewDesign(id){const d=designs.find(d=>d.id===id);modal(`<img src="${d.image}" alt="${d.name}" style="filter:${d.tint}"><div><span class="eyebrow">${d.category}</span><h2>${d.name}</h2><p>Доплата за дизайн від ${money(d.price)}. Фінальна вартість залежить від деталей.</p><button class="button" data-action="book" data-design="${d.id}">Хочу такий манікюр ${icon('ArrowUpRight')}</button></div>`,'design-modal',d.name)}
function previewMaster(id){const m=masters.find(m=>m.id===id);modal(`<img class="master-portrait" src="${m.image}" alt="${m.name}"><span class="eyebrow">ТВОЯ МАЙСТРИНЯ</span><h2>${m.name}</h2><p class="rating">${icon('Star',16,true)} ${m.rating} · ${m.reviews} відгуків · демодані</p><p>${m.bio}</p><p>${m.experience} років досвіду · ${m.specialty}</p><h3>Натхнення з портфоліо</h3><div class="portfolio">${designs.slice(0,3).map(d=>`<img src="${d.image}" alt="${d.name}">`).join('')}</div><button class="button" data-action="book" data-master="${m.id}">Записатися ${icon('ArrowUpRight',17)}</button>`,'master-modal',`Майстер ${m.name}`)}
async function next(){if(state.submitting)return;if(state.step===4&&(!state.time||!available(state.time)))return;if(state.step<5){state.step++;render();return}if(!state.time||!available(state.time)){state.step=4;render();notify('Цей час уже зайнятий. Оберіть інший.');return}state.submitting=true;render();await new Promise(r=>setTimeout(r,500));const id=state.rescheduleId||(window.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2));const a={id,serviceId:state.serviceId,masterId:state.masterId||masters.find(m=>available(state.time,m.id)).id,designId:state.designId,date:state.date,time:state.time,comment:state.comment,status:'confirmed',price:total()};state.appointments=state.appointments.filter(x=>x.id!==id).concat(a);state.success=a;state.submitting=false;persist();tg?.HapticFeedback?.notificationOccurred('success');render();window.scrollTo({top:0,behavior:'smooth'});notify('Демозапис збережено')}
function back(){if(document.querySelector('[role="dialog"]'))closeModal();else if(state.page==='booking'&&state.step>0){state.step--;render()}else navigate('home')}
function updateTelegram(){if(!tg?.initData)return;if(telegramNextHandler)tg.MainButton.offClick(telegramNextHandler);if(telegramBackHandler)tg.BackButton.offClick(telegramBackHandler);telegramBackHandler=back;tg.BackButton.onClick(back);state.page==='home'?tg.BackButton.hide():tg.BackButton.show();if(state.page==='booking'&&!state.success){telegramNextHandler=next;tg.MainButton.setText(state.step===5?'Зберегти демозапис':'Продовжити');tg.MainButton.onClick(next);tg.MainButton.show();state.submitting||(state.step===4&&!state.time)?tg.MainButton.disable():tg.MainButton.enable()}else tg.MainButton.hide()}
document.addEventListener('input',e=>{if(e.target.id==='comment')state.comment=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||state.submitting)return;const a=b.dataset.action,id=Number(b.dataset.id);switch(a){
case 'page':state.favoritesOnly=false;navigate(b.dataset.page);break;
case 'book':closeModal();startBooking(Number(b.dataset.design)||null,Number(b.dataset.master)||0,Number(b.dataset.service)||2);break;
case 'quick':startBooking();state.date=b.dataset.date;state.time=b.dataset.time;render();break;
case 'favorites':state.favoritesOnly=true;state.category='Усі';navigate('designs');break;
case 'toggle-favorites':state.favoritesOnly=!state.favoritesOnly;render();break;
case 'all-designs':state.favoritesOnly=false;state.category='Усі';render();break;
case 'category':state.category=b.dataset.category;render();break;
case 'favorite':{const saved=state.favorites.includes(id);state.favorites=saved?state.favorites.filter(x=>x!==id):state.favorites.concat(id);persist();render();tg?.HapticFeedback?.impactOccurred('light');notify(saved?'Видалено з обраного':'Додано в обране ♡');break}
case 'preview':previewDesign(id);break;
case 'master-preview':previewMaster(id);break;
case 'service':state.serviceId=id;state.time='';render();break;
case 'master':state.masterId=id;state.time='';render();break;
case 'design':state.designId=id||null;render();break;
case 'date':state.date=b.dataset.date;state.time='';render();break;
case 'time':state.time=b.dataset.time;render();break;
case 'step':if(Number(b.dataset.step)<=state.step){state.step=Number(b.dataset.step);render()}break;
case 'next':void next();break;
case 'back':back();break;
case 'tab':state.tab=b.dataset.tab;render();break;
case 'reschedule':{const v=state.appointments.find(v=>v.id===b.dataset.id);Object.assign(state,{serviceId:v.serviceId,masterId:v.masterId,designId:v.designId,date:v.date,time:v.time,comment:v.comment,rescheduleId:v.id,step:3});navigate('booking');break}
case 'cancel':modal(`<span class="round-icon">${icon('CalendarDays',24)}</span><h2>Скасувати запис?</h2><p>Твій демозапис перейде у вкладку «Скасовані».</p><button class="button" data-action="confirm-cancel" data-id="${escapeHtml(b.dataset.id)}">Так, скасувати</button><button class="text-button" data-action="close-modal">Залишити запис</button>`,'small-modal','Скасувати запис');break;
case 'confirm-cancel':state.appointments=state.appointments.map(v=>v.id===b.dataset.id?{...v,status:'cancelled'}:v);persist();closeModal();render();notify('Демозапис скасовано');break;
case 'complete':state.appointments=state.appointments.map(v=>v.id===b.dataset.id?{...v,status:'completed'}:v);persist();render();break;
case 'history':navigate('appointments');break;
case 'admin':state.admin=true;render();window.scrollTo(0,0);break;
case 'contacts':case 'rules':modal(`<span class="eyebrow">LUNA NAILS</span><h2>${a==='contacts'?'Будьмо на зв’язку':'Трохи про турботу'}</h2>${a==='contacts'?`<p>${icon('MapPin',17)} Київ, Україна</p><p>Адресу, телефон та Instagram студії додамо перед запуском.</p><p class="demo-note">Контакти ще не налаштовані.</p>`:'<p>Приходь за 5 хвилин до запису, щоб спокійно обрати колір.</p><p>Якщо плани змінилися, перенеси або скасуй запис заздалегідь.</p><p>Повідом майстриню про зняття покриття в коментарі.</p><p class="demo-note">Приклад правил. Студія затвердить їх перед запуском.</p>'}<button class="button" data-action="close-modal">Зрозуміло ${icon('Check',17)}</button>`,'small-modal',a==='contacts'?'Контакти студії':'Правила запису');break;
case 'close-modal':closeModal();break;
case 'overlay':if(e.target===b)closeModal();break;
case 'close-app':tg?.initData?tg.close():navigate('home');break;
}});
document.addEventListener('keydown',e=>{const dialog=document.querySelector('[role="dialog"]');if(!dialog)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const list=[...dialog.querySelectorAll('button:not(:disabled),textarea,a[href]')];if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0]?.focus()}}});
function initializeTelegram(){tg=window.Telegram?.WebApp;user=tg?.initData?tg.initDataUnsafe.user:null;if(!tg?.initData)return;if(user){const avatar=document.getElementById('header-avatar');avatar.textContent=user.first_name?.[0]||'Г';if(user.photo_url){const img=document.createElement('img');img.src=user.photo_url;img.alt='';avatar.replaceChildren(img)}}tg.ready();tg.expand();const theme=()=>{document.documentElement.dataset.theme=tg.colorScheme};theme();tg.onEvent('themeChanged',theme);render()}
document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon,16));
render();
if(tg){initializeTelegram()}else{const sdk=document.createElement('script');sdk.src='https://telegram.org/js/telegram-web-app.js';sdk.async=true;sdk.onload=initializeTelegram;document.head.appendChild(sdk)}

</script>
</body>
</html>
