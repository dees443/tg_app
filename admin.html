function notify(text){document.getElementById('admin-toast').innerHTML='<div class="toast">'+esc(text)+'</div>';clearTimeout(noteTimer);noteTimer=setTimeout(()=>document.getElementById('admin-toast').replaceChildren(),3500)}
function configured(){return APP_CONFIG.supabaseUrl&&!APP_CONFIG.supabaseUrl.includes('YOUR_')&&APP_CONFIG.publishableKey}
async function auth(path,body,token){const r=await fetch(APP_CONFIG.supabaseUrl+'/auth/v1/'+path,{method:'POST',headers:{apikey:APP_CONFIG.publishableKey,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});const data=r.status===204?{}:await r.json();if(!r.ok)throw Error('Не вдалося увійти. Перевір email і пароль.');return data;}
function remember(s){session={access_token:s.access_token,refresh_token:s.refresh_token,expires_at:Math.floor(Date.now()/1000)+s.expires_in};sessionStorage.setItem('luna-admin-session',JSON.stringify(session))}
async function api(path,options={}){if(!session)throw Error('Увійди в адмінпанель.');if(session.expires_at<Math.floor(Date.now()/1000)+30)remember(await auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token}));let r;try{r=await fetch(APP_CONFIG.supabaseUrl+'/functions/v1/api/admin/'+path,{...options,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...options.headers},signal:AbortSignal.timeout(25000)})}catch{throw Error('Сервіс недоступний. Спробуй ще раз.')}const data=await r.json();if(!r.ok){if(r.status===401){session=null;sessionStorage.removeItem('luna-admin-session');admin.data=null;render()}throw Error(data.error||'Не вдалося виконати дію.')}return data;}
async function load(){if(!session||!configured()){render();return}admin.loading=true;admin.error='';render();try{admin.data=await api('snapshot')}catch(e){admin.error=e.message;}admin.loading=false;render();}
function addDays(day,n){const d=new Date(day+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function calendarDays(){if(admin.view==='day')return [admin.date];const d=new Date(admin.date+'T12:00:00Z');if(admin.view==='month')d.setUTCDate(1);const start=addDays(d.toISOString().slice(0,10),-((d.getUTCDay()+6)%7));return Array.from({length:admin.view==='month'?42:7},(_,i)=>addDays(start,i));}
function calendar(){const days=calendarDays();const rows=admin.data.appointments;return `<div class="calendar-toolbar"><select id="calendar-view" aria-label="Вигляд календаря">${[['day','День'],['week','Тиждень'],['month','Місяць']].map(([k,v])=>`<option value="${k}" ${k===admin.view?'selected':''}>${v}</option>`).join('')}</select><input id="calendar-date" type="date" aria-label="Дата календаря" value="${admin.date}"><button class="text-button" data-action="refresh">Оновити</button><span class="admin-status">Усі години — Київ</span></div>${admin.view==='day'?'':`<div class="calendar-grid">${days.map(day=>`<button class="${day===admin.date?'selected':''}" data-action="calendar-day" data-date="${day}"><strong>${day.slice(-2)}</strong><small>${rows.filter(a=>a.date===day&&a.status==='confirmed').length} записів</small></button>`).join('')}</div>`}${days.map(day=>{const list=rows.filter(a=>a.date===day);return admin.view==='month'&&day!==admin.date?'':`<h2 class="calendar-day-title">${new Date(day+'T12:00Z').toLocaleDateString('uk-UA',{day:'numeric',month:'long',weekday:'short',timeZone:'Europe/Kyiv'})}</h2>${list.length?list.map(a=>`<article class="appointment"><div class="appointment-info"><span class="status ${a.status}">${{confirmed:'Підтверджено',completed:'Виконано',cancelled:'Скасовано'}[a.status]}</span><h3>${esc(a.time)} · ${esc(a.clientName)}</h3><p>${esc(a.serviceName)} · ${esc(a.masterName)}${a.username?' · @'+esc(a.username):''}</p><p>${esc(a.comment||'Без коментаря')}</p><strong>${a.final_price!=null?'Остаточно '+money(a.final_price):'Орієнтовно від '+money(a.estimated_price)}</strong>${a.admin_comment?'<p>Нотатка: '+esc(a.admin_comment)+'</p>':''}</div><div class="admin-tools"><button data-action="appointment" data-operation="comment" data-id="${a.id}">Нотатка</button>${a.status==='confirmed'?`<button data-action="appointment" data-operation="reschedule" data-id="${a.id}">Перенести</button><button data-action="appointment" data-operation="cancel" data-id="${a.id}">Скасувати</button><button data-action="appointment" data-operation="complete" data-id="${a.id}">Завершити</button>`:''}</div></article>`).join(''):'<p class="subtle">На цей день немає записів.</p>'}`}).join('')}`;}
function table(entity){const rows=admin.data[entity];const name=r=>entity==='schedules'?`${admin.data.masters.find(m=>m.id===r.master_id)?.name||'Майстриня'} · ${['Нд','Пн','Вт','Ср','Чт','Пт','Сб'][r.day_of_week]}`:entity==='blocked_slots'?`${admin.data.masters.find(m=>m.id===r.master_id)?.name||'Майстриня'} · ${r.reason||'Заблоковано'}`:r.name;const info=r=>entity==='schedules'?r.start_time.slice(0,5)+'–'+r.end_time.slice(0,5):entity==='blocked_slots'?kyivLocal(r.starts_at).replace('T',' ')+' → '+kyivLocal(r.ends_at).replace('T',' '):entity==='services'?money(r.price)+' · '+r.duration+' хв':entity==='designs'?'від '+money(r.price)+' · '+r.category:r.specialty;return `<div class="admin-heading"><h1>${titles[entity]}</h1><button class="button" data-action="edit" data-entity="${entity}">Додати</button></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>Назва</th><th>Деталі</th><th>Дії</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.image?`<img src="${esc(r.image)}" alt="">`:''}${esc(name(r))}${r.active===false?'<small> · Архів</small>':''}</td><td>${esc(info(r))}</td><td><button data-action="edit" data-entity="${entity}" data-id="${r.id}">Редагувати</button><button data-action="remove" data-entity="${entity}" data-id="${r.id}">${['schedules','blocked_slots'].includes(entity)?'Видалити':'Архівувати'}</button></td></tr>`).join('')}</tbody></table></div>`;}
function render(){document.getElementById('account-actions').innerHTML=session?'<button class="text-button" data-action="logout">Вийти</button>':'';if(!session){document.getElementById('admin-main').innerHTML=`<section class="login-card"><span class="eyebrow">STUDIO SPACE · ТЕСТ</span><h1>Панель студії</h1><p class="demo-note">Вхід лише для адміністратора.</p>${!configured()?'<div class="admin-notice">Supabase ще не налаштований. Після створення проєкту підключи публічну конфігурацію та збери HTML.</div>':''}<form id="login-form" class="admin-form"><label>Email<input type="email" name="email" placeholder="Твій email" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><button class="button" ${!configured()?'disabled':''}>Увійти</button><p class="error" id="login-error" role="alert"></p></form></section>`;return}if(!admin.data){document.getElementById('admin-main').innerHTML=`<div class="empty"><h2>${admin.loading?'Завантажуємо студію…':'Не вдалося завантажити дані'}</h2><p>${esc(admin.error)}</p><button class="button" data-action="refresh">Спробувати знову</button></div>`;return}const today=dayOf(Date.now());const stats=[['Записів сьогодні',admin.data.appointments.filter(a=>a.date===today&&a.status==='confirmed').length],['Дохід за 90 днів',money(admin.data.appointments.filter(a=>a.status==='completed'&&a.final_price!=null).reduce((n,a)=>n+a.final_price,0))],['Активні майстри',admin.data.masters.filter(m=>m.active).length]];document.getElementById('admin-main').innerHTML=`<div class="test-banner">Тестова студія · email і пароль захищають доступ до даних</div><div class="admin-shell"><nav class="admin-sidebar">${Object.entries(titles).map(([key,title])=>`<button class="${admin.section===key?'active':''}" data-action="section" data-section="${key}">${title}</button>`).join('')}</nav><section>${admin.error?'<div class="admin-notice">'+esc(admin.error)+'</div>':''}${admin.section==='calendar'?`<div class="admin-heading"><h1>Календар студії</h1></div><div class="stats-grid">${stats.map(([l,v])=>`<article class="stat-card"><span>${l}</span><strong>${v}</strong></article>`).join('')}</div>${calendar()}`:admin.section==='settings'?`<h1>Налаштування</h1><div class="admin-notice">Сповіщення надсилаються в Telegram. Запусти @beaty_nails_bot і надішли /help, щоб дізнатися числовий ID.</div><form id="settings-form" class="admin-form"><label>Telegram ID адміністратора<input name="chat" type="number" min="1" step="1" value="${esc(admin.data.settings.admin_telegram_id||'')}"></label><p class="subtle">Username @morsikot не замінює числовий ID.</p><button class="button">Зберегти</button></form><div class="admin-notice">Часовий пояс: Київ. Пауза: 15 хвилин. Скасування клієнтом: до 12 годин. Передоплата не потрібна.</div>`:table(admin.section)}</section></div>`;}
function closeModal(){document.getElementById('admin-modal').replaceChildren();document.body.style.overflow='';modalFocus?.isConnected&&modalFocus.focus()}
function modal(html){modalFocus=document.activeElement;document.getElementById('admin-modal').innerHTML=`<div class="modal-overlay"><section class="admin-modal" role="dialog" aria-modal="true"><button class="modal-close" aria-label="Закрити" data-action="close-modal">×</button>${html}</section></div>`;document.body.style.overflow='hidden';document.querySelector('.admin-modal input,.admin-modal button')?.focus()}
const field=(name,label,type='text',value='',required=true)=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="1"':''} ${name==='name'?'maxlength="100"':''}></label>`;
function edit(entity,id){const row=admin.data[entity].find(r=>r.id===id)||{};let fields='';if(['masters','services','designs'].includes(entity))fields+=field('name','Назва', 'text',row.name);if(entity==='masters')fields+=field('specialty','Спеціалізація','text',row.specialty||'',false)+field('experience','Років досвіду','number',row.experience||0)+`<label>Про майстриню<textarea name="bio" maxlength="5000">${esc(row.bio)}</textarea></label>`;if(entity==='services')fields+=`<label>Опис<textarea name="description" maxlength="5000">${esc(row.description)}</textarea></label>`+field('price','Орієнтовна ціна, грн','number',row.price||500)+field('duration','Тривалість, хв (кратно 15)','number',row.duration||60);if(entity==='designs')fields+=`<label>Категорія<select name="category">${['French','Nude','Minimal','Bright','Dark','Nail Art','Seasonal','Wedding'].map(c=>`<option ${row.category===c?'selected':''}>${c}</option>`).join('')}</select></label>`+field('price','Доплата від, грн','number',row.price||50);if(['masters','designs'].includes(entity))fields+=field('image','Адреса фото (HTTPS)','text',row.image||'',false)+'<label>Або завантаж фото<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>';if(['designs','schedules','blocked_slots'].includes(entity))fields+=`<label>Майстриня<select name="master_id" ${entity!=='designs'?'required':''}>${entity==='designs'?'<option value="">Без прив’язки</option>':''}${admin.data.masters.map(m=>`<option value="${m.id}" ${row.master_id===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`;if(entity==='schedules')fields+=`<label>День тижня<select name="day_of_week">${['Неділя','Понеділок','Вівторок','Середа','Четвер','П’ятниця','Субота'].map((l,i)=>`<option value="${i}" ${row.day_of_week===i?'selected':''}>${l}</option>`).join('')}</select></label>`+field('start_time','Початок','time',row.start_time?.slice(0,5)||'09:00')+field('end_time','Кінець','time',row.end_time?.slice(0,5)||'18:00');if(entity==='blocked_slots')fields+=field('starts_at','Початок (Київ)','datetime-local',row.starts_at?kyivLocal(row.starts_at):'')+field('ends_at','Кінець (Київ)','datetime-local',row.ends_at?kyivLocal(row.ends_at):'')+field('reason','Причина','text',row.reason||'',false);if(row.id&&['masters','services','designs'].includes(entity))fields+=`<label class="checkbox-label"><input name="active" type="checkbox" ${row.active?'checked':''}> Активний запис у каталозі</label>`;modal(`<h2>${row.id?'Редагувати':'Додати'}: ${titles[entity]}</h2><form id="editor-form" class="admin-form" data-entity="${entity}" data-id="${row.id||''}">${fields}<button class="button">Зберегти</button><p class="error" role="alert"></p></form>`);}
function appointment(id,operation){const a=admin.data.appointments.find(a=>a.id===id);let fields=operation==='reschedule'?field('startsAt','Нові дата й час (Київ)','datetime-local',kyivLocal(a.starts_at))+`<label>Майстриня<select name="masterId">${admin.data.masters.filter(m=>m.active).map(m=>`<option value="${m.id}" ${m.id===a.masterId?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`:operation==='complete'?field('finalPrice','Узгоджена остаточна сума, грн','number',a.estimated_price):operation==='comment'?`<label>Нотатка адміністратора<textarea name="comment" maxlength="1000">${esc(a.admin_comment)}</textarea></label>`:'<p>Клієнт отримає повідомлення про скасування тестового запису.</p>';modal(`<h2>${{reschedule:'Перенести запис',complete:'Завершити візит',comment:'Нотатка',cancel:'Скасувати запис'}[operation]}</h2><form class="admin-form" id="appointment-form" data-id="${id}" data-operation="${operation}" data-key="${crypto.randomUUID()}">${fields}<button class="button">Підтвердити</button><p class="error" role="alert"></p></form>`);}
document.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const form=e.target;if(!form.checkValidity())return;busy=true;const button=form.querySelector('button[type=submit],button.button');button.disabled=true;try{
const values=Object.fromEntries(new FormData(form));if(form.id==='login-form'){remember(await auth('token?grant_type=password',{email:values.email,password:values.password}));await load();}
if(form.id==='settings-form'){await api('settings',{method:'PATCH',body:JSON.stringify({admin_telegram_id:values.chat?Number(values.chat):null})});notify('Налаштування збережено');await load();}
if(form.id==='editor-form'){const data={...values};delete data.photo;for(const k of ['price','duration','experience','master_id','day_of_week'])if(k in data)data[k]=data[k]===''?null:Number(data[k]);if(form.dataset.id){data.id=Number(form.dataset.id);if(form.elements.active)data.active=form.elements.active.checked;}for(const k of ['starts_at','ends_at'])if(data[k])data[k]=kyivISO(data[k]);const file=form.elements.photo?.files[0];if(file){if(file.size>5*1024*1024)throw Error('Максимум 5 МБ.');const encoded=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});data.image=(await api('upload',{method:'POST',body:JSON.stringify({type:file.type,data:encoded})})).url;}await api('catalog',{method:'POST',body:JSON.stringify({entity:form.dataset.entity,action:'save',data})});closeModal();notify('Збережено');await load();}
if(form.id==='appointment-form'){const payload={id:form.dataset.id,action:form.dataset.operation,...values};if(payload.startsAt)payload.startsAt=kyivISO(payload.startsAt);if(payload.masterId)payload.masterId=Number(payload.masterId);if(payload.finalPrice!=null)payload.finalPrice=Number(payload.finalPrice);await api('appointments',{method:'POST',headers:{'idempotency-key':form.dataset.key},body:JSON.stringify(payload)});closeModal();notify('Запис оновлено');await load();}
}catch(error){const slot=form.querySelector('.error')||document.getElementById('login-error');if(slot)slot.textContent=error.message;else notify(error.message);}finally{busy=false;button.disabled=false;}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;try{switch(b.dataset.action){case 'refresh':await load();break;case 'logout':try{await auth('logout',{},session.access_token)}finally{session=null;sessionStorage.removeItem('luna-admin-session');admin.data=null;render()}break;case 'section':admin.section=b.dataset.section;render();break;case 'calendar-day':admin.date=b.dataset.date;render();break;case 'edit':edit(b.dataset.entity,Number(b.dataset.id));break;case 'remove':modal(`<h2>${['schedules','blocked_slots'].includes(b.dataset.entity)?'Видалити':'Архівувати'}?</h2><p class="demo-note">Історія записів зберігається. Зміни графіка перевіряємо на конфлікти.</p><button class="button" data-action="confirm-remove" data-entity="${b.dataset.entity}" data-id="${b.dataset.id}">Підтвердити</button>`);break;case 'confirm-remove':busy=true;await api('catalog',{method:'POST',body:JSON.stringify({entity:b.dataset.entity,action:['schedules','blocked_slots'].includes(b.dataset.entity)?'delete':'archive',data:{id:Number(b.dataset.id)}})});closeModal();await load();busy=false;break;case 'appointment':appointment(b.dataset.id,b.dataset.operation);break;case 'close-modal':closeModal();break;}}catch(error){busy=false;notify(error.message);}});
document.addEventListener('change',e=>{if(e.target.id==='calendar-view'){admin.view=e.target.value;render()}if(e.target.id==='calendar-date'){admin.date=e.target.value;render()}});
document.addEventListener('keydown',e=>{const dialog=document.querySelector('[role=dialog]');if(!dialog)return;if(e.key==='Escape'&&!busy)closeModal();if(e.key==='Tab'){const els=[...dialog.querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')];if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0]?.focus()}}});
render();if(session&&configured())void load();
</script></body></html>
